[package]
name = "couchaxis"
version = "0.1.1"
description = "Gamepad-first local video browser"
authors = ["CouchAxis contributors"]
edition = "2021"

[[bin]]
name = "couchaxis"
path = "src/main.rs"
test = false
bench = false

[lib]
name = "couchaxis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
lofty = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-libmpv = "=0.3.2"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
